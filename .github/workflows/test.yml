name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The unit tests load no model, so skip the ~0.65 GB download in build.rs.
  SKIP_MODEL_DOWNLOAD: "1"

jobs:
  test:
    # macOS only: the CoreML crate compiles a Swift bridge with Xcode's toolchain.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (statically linked into the binary at build time)
        run: brew install ffmpeg pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --bin transcribe --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --bin transcribe
