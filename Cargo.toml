[package]
name = "transcriber-cli"
version = "0.1.0"
edition = "2021"
authors = ["Dobri"]
description = "Audio transcription CLI utilities using NVIDIA Parakeet and Nemotron models"
build = "scripts/build.rs"

[[bin]]
name = "download-models"
path = "scripts/download_models.rs"

[[bin]]
name = "transcribe"
path = "src/transcribe.rs"

[[bin]]
name = "stranscribe"
path = "src/stranscribe.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
anyhow = "1.0"
parakeet-rs = "0.4.1"
ffmpeg-next = "9.0"

[dependencies.ffmpeg-sys-next]
version = "9.0"
features = ["static"]
