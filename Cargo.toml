[package]
name = "transcriber-cli"
version = "0.1.0"
edition = "2021"
authors = ["Dobri"]
description = "Audio transcription CLI using NVIDIA Parakeet TDT on CoreML"
build = "scripts/build.rs"

[[bin]]
name = "download-models"
path = "scripts/download_models.rs"

[[bin]]
name = "transcribe"
path = "src/transcribe.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
serde_json = "1.0"
anyhow = "1.0"
ffmpeg-next = "9.0"
coreml = "0.4"
half = "2"

[dependencies.ffmpeg-sys-next]
version = "9.0"
features = ["static"]

